spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: testSecretKey123456789012345678901234567890123456789012345678901234
  expiration: 86400000

anthropic:
  api-key: test-key
  api-url: https://api.anthropic.com/v1/messages
  model: claude-3-5-sonnet-20241022

aws:
  region: us-east-1
  s3:
    bucket: test-bucket
